name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Match tag to package version
        run: python scripts/validate_release_tag.py "${GITHUB_REF_NAME}"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Check formatting
        run: python -m black --check .

      - name: Lint source
        run: python -m ruff check .

      - name: Run normal test suite
        env:
          AI_FILE_LOGGING_ENABLED: "false"
        run: python -m pytest -q

  build:
    name: Build tagged distributions
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Validate distribution archives
        run: python scripts/validate_distributions.py

      - name: Upload tagged distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/python-ai-toolkit
    permissions:
      id-token: write

    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-${{ github.ref_name }}
          path: dist/

      - name: Publish distributions with trusted identity
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/
